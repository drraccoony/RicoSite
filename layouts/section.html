{{ define "main" }}
    <section class="landing-intro">
        <h1>{{ .Title }}</h1>
        {{ with .Params.subtitle }}<p class="page-subtitle">{{ . }}</p>{{ end }}
        {{ .Content }}
    </section>

    <section class="offer-grid">
        {{ range .Pages }}
            <a class="offer-card" href="{{ .RelPermalink }}">
                <h2>{{ .Title }}</h2>
                {{ with .Params.subtitle | default .Params.tagline }}<p>{{ . }}</p>{{ end }}
            </a>
        {{ end }}
    </section>
{{ end }}
